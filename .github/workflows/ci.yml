name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      # The window is plain classic scripts with no bundler or test runner, so a parse
      # check is the meaningful automated gate. Visual behaviour is verified by hand —
      # see the checklist in the PR template.
      - name: Parse-check every script
        run: |
          for f in src/*.js scripts/*.mjs; do
            echo "checking $f"
            node --check "$f"
          done
      # Deliberately not byte-comparing against the committed icons: PNG bytes depend on
      # the platform's zlib, so a diff here would mean "different runner", not "stale".
      - name: Icon generator runs and produces valid PNGs
        run: |
          node scripts/gen-icons.mjs
          for f in src-tauri/icons/icon.png src-tauri/icons/tray.png; do
            # PNG magic bytes
            head -c8 "$f" | od -An -tx1 | grep -q "89 50 4e 47" || { echo "$f is not a PNG"; exit 1; }
          done

  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Severity limited to errors: the scripts intentionally use constructs that trip
      # style warnings (heredocs feeding python, best-effort redirects).
      - name: shellcheck
        run: shellcheck --severity=error scripts/*.sh

  rust:
    name: Rust
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build
        run: cargo build --manifest-path src-tauri/Cargo.toml
